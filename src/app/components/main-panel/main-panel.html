<div class="main-panel-container">
  @if (selectedMesa$ | async; as selectedMesa) {
    <app-mesa-details [mesaId]="selectedMesa.id"></app-mesa-details>
  } @else {
    <div class="salon-detail">
      <div class="salon-header">
        <h2>Mesas</h2>
        <button class="btn-add" (click)="openMesaForm()">+ Agregar Mesa</button>
      </div>

      <div class="mesas-section">
        <div class="mesas-interactive-grid">
          <ng-container *ngIf="mesas$ | async as mesas">
            <ng-container *ngFor="let mesa of mesas">
              <div
                class="mesa-card"
                [style.border-color]="getEstadoColor(mesa.estado)"
                (click)="selectMesa(mesa)"
              >
                <div class="mesa-number">{{ mesa.numero }}</div>
                <div class="mesa-estado" [style.background-color]="getEstadoColor(mesa.estado)">
                  {{ mesa.estado.charAt(0).toUpperCase() }}
                </div>
                <div class="mesa-capacidad">{{ mesa.capacidad }} pers</div>
                <div *ngIf="mesa.estado === 'Ocupada'" class="mesa-ocupacion">
                  {{ mesa.clientesActuales }}/{{ mesa.capacidad }}
                </div>
                <div *ngIf="mesa.estado === 'Ocupada'" class="mesa-tiempo">
                  {{ getTiempoOcupacion(mesa) }}
                </div>
              </div>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  }
</div>
@if (showMesaForm) {
  <div class="modal-overlay" (click)="closeMesaForm()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <app-mesa-form (formClosed)="closeMesaForm()" (mesaCreated)="onMesaCreated()">
      </app-mesa-form>
    </div>
  </div>
}
