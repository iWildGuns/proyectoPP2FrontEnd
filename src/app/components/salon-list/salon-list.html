<div class="salon-list-container">
  <div class="salon-list-header">
    <h2>Salones</h2>
    <p class="salon-count">{{ (salones$ | async)?.length || 0 }}</p>
  </div>

  <ul class="salon-list">
    <li
      *ngFor="let salon of salones$ | async"
      class="salon-item"
      [class.selected]="(selectedSalon$ | async)?.id === salon.id"
      (click)="selectSalon(salon)"
    >
      <div class="salon-info">
        <h3 class="salon-name">{{ salon.nombre }}</h3>
        <p class="salon-description">{{ salon.descripcion }}</p>
        <div class="salon-details">
          <span class="salon-capacity">👥 {{ salon.capacidad }} personas</span>
          <span class="salon-mesas">🍽️ {{ salon.mesas?.length || 0 }} mesas</span>
        </div>
        <div
          class="salon-status"
          [class.habilitado]="salon.habilitado"
          [class.deshabilitado]="!salon.habilitado"
        >
          {{ salon.habilitado ? 'Habilitado' : 'Deshabilitado' }}
        </div>
      </div>
    </li>
  </ul>
</div>
